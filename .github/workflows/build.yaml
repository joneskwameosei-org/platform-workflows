# The platform's build workflow (runbook 4.1). Services call it; they never copy it.
# Push by digest -> scan -> SBOM -> sign + attest. The signature is the gate: Kyverno (4.3) admits only images
# signed by THIS workflow, and an image that fails the scan is never signed.
# Third-party actions are pinned to full commit SHAs (D-046); the comment names the release.
name: build

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context
        type: string
        default: .
      dockerfile:
        description: Path to the Dockerfile
        type: string
        default: Dockerfile
      fail-on:
        description: Trivy severities that fail the build (fixable vulnerabilities only)
        type: string
        default: CRITICAL
    outputs:
      image:
        description: Image name, without tag or digest
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Image digest (sha256:...)
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read      # check out the caller's repo
      packages: write     # push to ghcr.io
      id-token: write     # GitHub OIDC token -> Sigstore certificate (keyless signing)
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
      SYFT_IMAGE: ghcr.io/anchore/syft:v1.56.0@sha256:697ae864af1299cfa43c54b161cea3dd65c6d54de82e3dba66ea3dccb3acc313
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name (registries need lower case)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (by digest; the tag is only for people)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # The scanners read the image from the registry, which may still be private right after the first push.
      # They get this job's token (expires with the job; can push but can't sign) and are pinned by digest.
      - name: Scan (fails the job before anything is signed)
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
          FAIL_ON: ${{ inputs.fail-on }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD "$TRIVY_IMAGE" image --no-progress \
            --ignore-unfixed --severity "$FAIL_ON" --exit-code 1 "$REF"

      - name: SBOM (SPDX)
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
          SYFT_REGISTRY_AUTH_AUTHORITY: ghcr.io
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e SYFT_REGISTRY_AUTH_AUTHORITY -e SYFT_REGISTRY_AUTH_USERNAME \
            -e SYFT_REGISTRY_AUTH_PASSWORD "$SYFT_IMAGE" "$REF" -o spdx-json > sbom.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign and attest the SBOM (keyless)
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

      - name: Summary
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Built, scanned and signed"
            echo '```'
            echo "$REF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
